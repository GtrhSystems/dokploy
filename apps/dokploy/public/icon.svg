<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <style>
        .gp-stroke { stroke: #000000; }
        .gp-fill { fill: #000000; }
        @media (prefers-color-scheme: dark) {
            .gp-stroke { stroke: #ffffff; }
            .gp-fill { fill: #ffffff; }
        }
    </style>
    <defs>
        <linearGradient id="gp-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:currentColor;stop-opacity:1" />
            <stop offset="100%" style="stop-color:currentColor;stop-opacity:0.6" />
        </linearGradient>
    </defs>
    
    <!-- G Component: Perfect Circular Arc centered at 50,50 -->
    <path class="gp-stroke" d="M 75 25 A 35 35 0 1 0 50 85 H 75" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- P Component: Central Axis and Loop -->
    <path class="gp-stroke" d="M 50 75 V 25 H 65 A 15 15 0 0 1 65 55 H 50" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Central Pivot Dot -->
    <circle class="gp-fill" cx="50" cy="50" r="5" />
</svg>
